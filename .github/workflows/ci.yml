name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    # The tests need no model libraries, so the light quick-start requirements
    # are enough; the full `uv sync` would pull PyTorch for nothing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -r requirements/ui.txt pytest
      - run: uv run --no-project python -m pytest -q

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: run.ps1 parses
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\run.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: run.bat --help
        shell: cmd
        run: run.bat --help
      - name: run.bat rejects unknown options
        shell: cmd
        run: |
          call run.bat --typo < NUL
          if %ERRORLEVEL% NEQ 2 exit /b 1
          exit /b 0
