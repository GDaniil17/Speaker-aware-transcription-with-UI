[project]
name = "speaker-transcribe"
version = "0.1.0"
description = "Local speaker-aware transcription (Whisper + pyannote diarization) with a Streamlit UI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "pyannote.audio==4.0.4",
    "pyannote.core>=6.0",
    "pyannote.pipeline>=4.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "streamlit>=1.36",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
transcribe = "speaker_transcribe.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speaker_transcribe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["code_from_notebook_base.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"code_from_notebook_base.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
