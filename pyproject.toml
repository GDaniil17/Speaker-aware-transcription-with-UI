[project]
name = "speaker-transcribe"
version = "0.1.0"
description = "Local speaker-aware transcription (Whisper and other ASR engines + pyannote diarization) with a Streamlit UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GDaniil17" }]
requires-python = ">=3.11,<3.13"
keywords = ["transcription", "speech-to-text", "whisper", "diarization", "pyannote", "streamlit", "subtitles"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "pyannote.audio==4.0.4",
    "pyannote.core>=6.0",
    "pyannote.pipeline>=4.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "onnxruntime>=1.17",
    # GigaAM v2 (Russian ASR) on ONNX Runtime; light, so not an optional extra.
    "onnx-asr[cpu,hub]>=0.12",
    "numpy>=1.26",
    "streamlit>=1.36",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# Alternative local ASR engines. Installed separately because their deps are
# heavy and version-pinned, and may conflict with each other or the pinned
# torch/pyannote — use a dedicated venv per engine if resolution fails.
parakeet = ["nemo_toolkit[asr]>=2.0"]
parakeet-mlx = [
    "parakeet-mlx>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
qwen3-asr = ["qwen-asr"]
sensevoice = ["funasr>=1.1"]

[project.urls]
Homepage = "https://github.com/GDaniil17/Speaker-aware-transcription-with-UI"
Issues = "https://github.com/GDaniil17/Speaker-aware-transcription-with-UI/issues"

[project.scripts]
transcribe = "speaker_transcribe.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speaker_transcribe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
